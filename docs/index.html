<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foosball Website</title>
<link rel="icon" type="image/png" href="assets/ranking.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>

<header class="hero">
<h1>⚽ Foosball Website</h1>
<p>CBGP statistics</p>
<a href="admin.html" class="admin-button">
	Add new games
</a>
</header>

<main class="container">
<section class="card">

<h2>🏆 Ranking</h2>

<table id="ranking">

<thead>
<tr>
    <th>Rank</th>
    <th>Player</th>
    <th>Score</th>
    <th>μ</th>
    <th>σ</th>
    <th>Games</th>
</tr>
</thead>

<tbody id="rankingBody"></tbody>

</table>

</section>
<section class="card">
<h2 style="margin-top:50px;">📈 TrueSkill score evolution</h2>

<div style="width:90%;margin:auto;text-align:center;margin-bottom:20px;">
    <button onclick="setRange('all')">From the beginning</button>
    <button onclick="setRange('year')">This year</button>
    <button onclick="setRange('week')">Last 7 days</button>

    <br><br>

    <span style="font-size:0.85em;">
        From <input type="date" id="fromDate">
        to <input type="date" id="toDate">
    </span>
    <button onclick="setCustomRange()">OK</button>

    <br><br>

    <button onclick="toggleXAxis()">🔄 Switch X-axis (time / match days)</button><br>
    <small>Time = calendar days • Match days = only days with games</small>
</div>

<div class="chart-container">
    <canvas id="allPlayersChart"></canvas>
</div>

</section>

<section class="card">
    <h2>⚽ Last games</h2>

    <table class="matches-table">
        <tbody id="recentMatches"></tbody>
    </table>
</section>

</main>
<script src="assets/app.js"></script>
</body>
</html>
