<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Player profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>
<header class="hero">
    <h1 id="playerName">👤 Player</h1>
    <p id="playerSubtitle"></p>
</header>
<main class="container">
    <!-- Retour -->
    <section class="card">
        <a href="index.html">⬅ Back to 🏆 Ranking</a>
    </section>
    <!-- Résumé -->
    <section class="card">
        <h2>🏆 Profile</h2>
        <div class="stats">
            <div>
                <span id="rank">-</span>
                <small>Rank</small>
            </div>
            <div>
                <span id="score">-</span>
                <small>Score</small>
            </div>
            <div>
                <span id="matches">-</span>
                <small>Matches</small>
            </div>
            <div>
                <span id="winrate">-</span>
                <small>Win rate</small>
            </div>
            <div class="stat-card" id="nemesisCountCard">
				<span id="nemesisCount">-</span>
				<small>Nemesis ratio</small>
			</div>
        </div>
        <br>
        <table>
            <tbody>
            <tr>
                <td>μ</td>
                <td id="mu"></td>
            </tr>
            <tr>
                <td>σ</td>
                <td id="sigma"></td>
            </tr>
            <tr>
                <td>First match</td>
                <td id="firstMatch"></td>
            </tr>
            <tr>
                <td>Last match</td>
                <td id="lastMatch"></td>
            </tr>
            </tbody>
        </table>
    </section>
    
    <!-- Relations -->
    <section class="card">

    <h2>🤝 Rivalries</h2>

    <div class="relation-grid">

		<div class="relation-card" id="dreamMateCard">
			<h3>❤️ Dream teammate</h3>
			<div id="dreamMate"></div>
		</div>
		
		<div class="relation-card" id="nemesisCard">
			<h3>💀 Nemesis</h3>
			<div id="nemesis"></div>
		</div>
		
		<div class="relation-card" id="victimCard">
			<h3>🎯 Favorite victim</h3>
			<div id="victim"></div>
		</div>
		
		<div class="relation-card" id="rivalCard">
			<h3>⚔ Biggest rival</h3>
			<div id="rival"></div>
		</div>

    </div>

	</section>
    <!-- Records -->
    <section class="card">
        <h2>🏅 Records</h2>
        <div class="stats">
            <div>
                <span id="bestStreak"></span>
                <small>Longest win streak</small>
            </div>
            <div>
                <span id="worstStreak"></span>
                <small>Longest losing streak</small>
            </div>
            <div>
                <span id="bestScore"></span>
                <small>Best TrueSkill</small>
            </div>
        </div>
    </section>
</main>
<script src="assets/player.js"></script>
</body>
</html>
